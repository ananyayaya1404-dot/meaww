<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open your surprise</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(135deg, #ffd6e5, #ffeaf1, #ffd9e7, #fff0f5);
    color: #713d54;
  }
  .card {
    text-align: center;
    padding: 40px 32px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 28px;
    font-weight: normal;
  }
  a.button {
    display: block;
    text-decoration: none;
    color: #713d54;
    background: rgba(255,255,255,.6);
    border: 1px solid rgba(113,61,84,.3);
    border-radius: 10px;
    padding: 16px 28px;
    margin: 14px auto;
    max-width: 320px;
    font-size: 1.05rem;
    transition: transform .2s ease, background .2s ease;
  }
  a.button:hover {
    background: rgba(255,255,255,.9);
    transform: translateY(-2px);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>For you ♡</h1>
    <a class="button" href="Surprise.html">Open the surprise</a>
    <a class="button" href="SURPRISE!!!!!.HTML">Open the other surprise</a>
  </div>
</body>
</html>
